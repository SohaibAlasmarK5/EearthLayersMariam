<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طبقات الأرض</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #04070f;
      font-family: 'Cairo', sans-serif;
      color: white;
    }

    /* canvas */

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* side panel */

    .panel {
      position: fixed;
      right: 20px;
      top: 20px;
      width: 260px;
      background: rgba(10, 15, 25, .82);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 18px;
      padding: 20px;
      z-index: 5;
      backdrop-filter: blur(12px);
    }

    .title {
      font-size: 34px;
      font-weight: 700;
    }

    .sub {
      font-size: 11px;
      color: #8b94a7;
      margin-bottom: 20px;
    }

    .card {
      border: 1px solid rgba(255, 255, 255, .08);
      border-right: 5px solid var(--c);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: .25s;
      background: rgba(255, 255, 255, .03);
    }

    .card:hover,
    .card.active {
      background: rgba(255, 255, 255, .08);
      transform: translateX(-6px);
    }

    .card h3 {
      font-size: 15px;
      margin-bottom: 5px;
      color: var(--c);
    }

    .card p {
      font-size: 11px;
      color: #c5c9d3;
      line-height: 1.8;
    }

    /* label */

    .info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      font-weight: 700;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
      z-index: 10;
    }

    .info.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="panel">

    <div class="title">طبقات الأرض</div>
    <div class="sub">نموذج ثلاثي الأبعاد</div>

    <div class="card" data-layer="0" style="--c:#ff5a36">
      <h3>اللب الداخلي</h3>
      <p>أعمق طبقات الأرض ويتكون من الحديد الصلب</p>
    </div>

    <div class="card" data-layer="1" style="--c:#ffb347">
      <h3>اللب الخارجي</h3>
      <p>حديد ونيكل سائل مسؤول عن المجال المغناطيسي</p>
    </div>

    <div class="card" data-layer="2" style="--c:#c97b3b">
      <h3>الوشاح</h3>
      <p>طبقة سميكة من الصخور الساخنة شبه المنصهرة</p>
    </div>

    <div class="card" data-layer="3" style="--c:#4da6ff">
      <h3>القشرة الأرضية</h3>
      <p>السطح الخارجي الذي نعيش عليه</p>
    </div>

  </div>

  <div class="info" id="label"></div>

  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>

    /* =========================
       SCENE
    ========================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      innerWidth / innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0, 4);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById("canvas"),
      antialias: true
    });

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);

    scene.background = new THREE.Color(0x04070f);

    /* =========================
       LIGHTS
    ========================= */

    const ambient = new THREE.AmbientLight(0xffffff, .65);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    /* =========================
       STARS
    ========================= */

    const starGeo = new THREE.BufferGeometry();
    const stars = [];

    for (let i = 0; i < 2500; i++) {

      stars.push(
        (Math.random() - .5) * 150,
        (Math.random() - .5) * 150,
        (Math.random() - .5) * 150
      );

    }

    starGeo.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(stars, 3)
    );

    scene.add(
      new THREE.Points(
        starGeo,
        new THREE.PointsMaterial({
          color: 0xffffff,
          size: .03
        })
      )
    );

    /* =========================
       EARTH GROUP
    ========================= */

    const earth = new THREE.Group();
    scene.add(earth);

    /* =========================
       LAYERS
    ========================= */

    const layers = [

      {
        name: "اللب الداخلي",
        color: 0xff5a36,
        inner: 0,
        outer: .28
      },

      {
        name: "اللب الخارجي",
        color: 0xffb347,
        inner: .28,
        outer: .48
      },

      {
        name: "الوشاح",
        color: 0xc97b3b,
        inner: .48,
        outer: .82
      },

      {
        name: "القشرة الأرضية",
        color: 0x4da6ff,
        inner: .82,
        outer: 1
      }

    ];

    const meshes = [];

    /* =========================
       CREATE FILLED LAYERS
    ========================= */

    layers.forEach((layer, i) => {

      /* نصف كرة */

      const geo = new THREE.SphereGeometry(
        layer.outer,
        80,
        80,
        0,
        Math.PI
      );

      /* القشرة تبدو مثل الأرض */

      let material;

      if (i === 3) {

        material = new THREE.MeshStandardMaterial({
          color: 0x2f6edb,
          roughness: .9,
          metalness: 0
        });

      } else {

        material = new THREE.MeshStandardMaterial({
          color: layer.color,
          roughness: .6,
          metalness: .05
        });

      }

      const mesh = new THREE.Mesh(geo, material);

      mesh.userData.index = i;

      earth.add(mesh);

      meshes.push(mesh);

      /* واجهة الطبقة */

      const ring = new THREE.Mesh(

        new THREE.RingGeometry(
          layer.inner,
          layer.outer,
          80
        ),

        new THREE.MeshStandardMaterial({
          color: layer.color,
          roughness: .5,
          metalness: .05,
          side: THREE.DoubleSide
        })

      );

      ring.rotation.y = Math.PI / 2;

      ring.userData.index = i;

      earth.add(ring);

      meshes.push(ring);

    });

    /* =========================
       CLOUD / ATMOSPHERE
    ========================= */

    const atmosphere = new THREE.Mesh(

      new THREE.SphereGeometry(1.03, 64, 64),

      new THREE.MeshBasicMaterial({
        color: 0x6bbcff,
        transparent: true,
        opacity: .12,
        side: THREE.BackSide
      })

    );

    earth.add(atmosphere);

    /* =========================
       AUDIO
    ========================= */

    const sounds = [

      new Audio("core.mp3"),
      new Audio("outercore.mp3"),
      new Audio("mantle.mp3"),
      new Audio("crust.mp3")

    ];

    sounds.forEach(s => {
      s.volume = .7;
    });

    /* =========================
       HOVER
    ========================= */

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const label = document.getElementById("label");
    const cards = document.querySelectorAll(".card");

    let hovered = -1;

    window.addEventListener("mousemove", (e) => {

      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;

    });

    function setHover(index) {

      if (index === hovered) return;

      hovered = index;

      meshes.forEach((m, i) => {

        const layerIndex = m.userData.index;

        if (index === -1) {

          m.material.opacity = 1;

        } else {

          m.material.transparent = true;

          if (layerIndex === index) {

            m.material.opacity = 1;

          } else {

            m.material.opacity = 0.12;

          }

        }

        if (m.material.emissive) {

          m.material.emissive.setHex(
            layerIndex === index
              ? layers[layerIndex].color
              : 0x000000
          );

          m.material.emissiveIntensity =
            layerIndex === index ? .45 : 0;

        }

      });

      cards.forEach((card, i) => {
        card.classList.toggle("active", i === index);
      });

      if (index >= 0) {

        if (sounds[index].paused) {

          sounds[index].currentTime = 0;
          sounds[index].play();

        }

        label.innerHTML = layers[index].name;

        label.style.color =
          "#" + layers[index].color.toString(16);

        label.classList.add("show");

      } else {

        sounds.forEach(s => s.pause());

        label.classList.remove("show");

      }

    }

    /* =========================
       CARD HOVER
    ========================= */

    cards.forEach(card => {

      card.addEventListener("mouseenter", () => {

        setHover(Number(card.dataset.layer));

      });

      card.addEventListener("mouseleave", () => {

        setHover(-1);

      });

    });

    /* =========================
       DRAG ROTATION ONLY
    ========================= */

    let rotX = .15;
    let rotY = -.45;

    let dragging = false;
    let px = 0;
    let py = 0;

    window.addEventListener("mousedown", (e) => {

      dragging = true;

      px = e.clientX;
      py = e.clientY;

    });

    window.addEventListener("mouseup", () => {

      dragging = false;

    });

    window.addEventListener("mousemove", (e) => {

      if (!dragging) return;

      rotY += (e.clientX - px) * .005;
      rotX += (e.clientY - py) * .005;

      px = e.clientX;
      py = e.clientY;

    });

    /* =========================
       ANIMATION
    ========================= */

    function animate() {

      requestAnimationFrame(animate);

      earth.rotation.x +=
        (rotX - earth.rotation.x) * .06;

      earth.rotation.y +=
        (rotY - earth.rotation.y) * .06;

      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(meshes);

      if (hits.length) {

        setHover(hits[0].object.userData.index);

      } else {

        setHover(-1);

      }

      renderer.render(scene, camera);

    }

    animate();

    /* =========================
       RESIZE
    ========================= */

    window.addEventListener("resize", () => {

      camera.aspect = innerWidth / innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(innerWidth, innerHeight);

    });

  </script>

</body>

</html>
